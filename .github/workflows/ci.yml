name: Synthetic demo tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s 05_KIEM_THU -p 'test_*.py'
      - run: python staging/demo/p1-schema/test_schema_demo.py
      - run: python staging/demo/p1-manifest/test_manifest_demo.py
      - run: python staging/demo/workbook-misa/test_envelope_demo.py
      - run: python staging/demo/pilot-cash/test_pilot_cash_demo.py
      - run: python staging/demo/pilot-cash/test_case20_engine.py
      - run: python staging/demo/test_m3_p1_bridge.py
      - run: python staging/demo/test_cash_review_flow.py
  windows-workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test parallel synthetic workbooks
        shell: powershell
        run: .\staging\demo\test_workflow.ps1
